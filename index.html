<!DOCTYPE html>
<html>
<head>
  <title>For You 💙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <img id="slide" src="img/Foto1.jpg">
  <p id="text"></p>
  <button onclick="nextSlide()">Klik aku ya 💙</button>
</div>

<audio id="music" src="img/Music1.mpeg"></audio>


<script>
let images = [
  "img/Foto2.jpg",
  "img/Foto3.jpg",
  "img/Foto4.jpg",
  "img/Foto6.jpg",
  "img/Foto5.jpeg"
];

let i = 0;

function nextSlide(){
  let slide = document.getElementById("slide");
  let text = document.getElementById("text");
  let music = document.getElementById("music");

  music.play();

  if (i < images.length - 1) {
    i++;
    slide.src = images[i];
  } else {
    slide.style.display = "none";
    text.innerText = "Aku ga jago kata-kata, Aku mau mulai dari satu hal yang mungkin sering aku lupa ucapin… maaf.Maaf kalau selama ini aku masih sering bikin kamu capek, maaf kalau aku kadang terlalu banyak maunya tanpa mikirin kamu lagi gimana, maaf kalau sikap aku pernah bikin kamu ngerasa ga dihargai, atau ngerasa sendirian padahal kita lagi sama-sama jalanin ini. Aku sadar, jadi aku itu ga selalu mudah. Kadang aku egois, kadang aku keras kepala, dan kadang aku lebih fokus sama perasaan aku sendiri sampai lupa kalau kamu juga punya perasaan yang harus dijaga. Tapi di balik semua itu, aku bener-bener lagi belajar… pelan-pelan. Belajar buat lebih ngerti kamu,belajar buat lebih sabar,dan belajar supaya aku bisa jadi seseorang yang lebih baik buat kamu.Dan selain maaf, aku juga mau bilang makasih… banyak banget makasih.Makasih karena kamu masih ada sampai sekarang,makasih karena kamu ga pergi walaupun aku sering nyusahin,makasih karena kamu tetap sabar ngadepin aku,bahkan di saat aku lagi ga jadi versi terbaik dari diri aku sendiri.Makasih juga karena kamu tetap milih aku,di saat mungkin kamu punya banyak alasan buat pergi.Aku mungkin ga selalu bisa nunjukin dengan cara yang sempurna, tapi aku beneran sayang sama kamu, dan aku beneran hargai semua yang kamu lakuin buat aku dan hubungan ini. Aku ga janji bakal langsung berubah jadi sempurna, tapi aku janji… aku ga akan berhenti usaha.Karena kamu sepenting itu buat aku. Jadi sekali lagi… maaf untuk semua yang kurang dari aku, dan makasih karena kamu tetap bertahan. iqbal sehat terus yaa, very lucky to have you in the world...i love you 💙";
    document.querySelector("button").innerText = "Selesai";
    document.querySelector("button").disabled = true;
  }
}
</script>
</body>
